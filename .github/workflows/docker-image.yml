name: ci

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  pull_request:
    # Runs for PRs against any base branch so stacked PRs get checks too.
    branches:
      - '**'

# Nothing here writes to the repository: the build only reads the checkout.
# Declaring the scope means a step cannot inherit a broader token.
permissions:
  contents: read

jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        # Full history so the pull request's base commit exists for git diff.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide whether to build
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != 'pull_request' ]; then
            # Merges to main and tags publish an image, so there is nothing to
            # filter: the published image must match the tree it was built from.
            echo 'build=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Merge base to head, the definition GitHub uses for a pull request's files.
          # A base..head comparison compares trees, so a branch behind main reports
          # main's commits as changed and gets a build for a non-build change.
          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true)

          # Fail open. If either commit is not in the clone, build anyway: a skipped
          # publish is worse than a slow pull request.
          if [ -z "$base" ]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$base" "$HEAD_SHA")
          printf 'Changed files:\n%s\n' "$changed"
          if printf '%s\n' "$changed" \
            | grep -q -e '^Dockerfile$' -e '^requirements.*\.txt$' -e '^\.github/workflows/'
          then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build=false' >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # The same style pre-commit applies (.pre-commit-config.yaml runs
      # ruff-format), enforced here so a commit that skipped pre-commit cannot
      # leave the tree formatted differently than the next run would.
      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: [changed, test]
    # changed runs on every event, so this condition is evaluated. It used to be
    # gated by `if: github.event_name == 'pull_request'`, and a job whose
    # dependency is skipped is skipped regardless of its own condition, so on push
    # and tag events this job never ran and nothing was published.
    if: github.event_name != 'pull_request' || needs.changed.outputs.build == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          images: |
            kmb32123/youtube-dl-server
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          # Pull requests build amd64 only for fast feedback (no QEMU emulation);
          # merges to main and tags build the full matrix that is published.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6' }}
          push: ${{ github.event_name != 'pull_request' }}
          # Load the pull request image into the runner's docker daemon for the smoke
          # test. Multi-platform builds cannot be loaded.
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: |
          image=$(printf '%s\n' "$IMAGE" | head -n 1)

          # Pull request images are loaded locally; merge builds test the pushed image.
          if [ "$GITHUB_EVENT_NAME" != 'pull_request' ]; then
            docker pull "$image"
          fi

          # Uses the image's own HEALTHCHECK, with a shorter interval so CI does not
          # wait for the scheduled 30s probe. Proves uvicorn starts, the app imports,
          # and the output directory is writable.
          docker run -d --name smoke \
            --health-start-period=2s --health-interval=1s --health-retries=5 \
            "$image"

          ok=0
          for _ in $(seq 1 15); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = 'healthy' ]; then
              ok=1
              break
            fi
            sleep 2
          done

          docker logs smoke
          docker stop -t 5 smoke > /dev/null
          if [ "$ok" != '1' ]; then
            echo 'container never became healthy'
            exit 1
          fi
        shell: bash
